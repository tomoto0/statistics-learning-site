<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
<title id="title">Macroeconomic series and forecast horizon</title><desc id="desc">A simulated observed series in illustrative units ends at a forecast origin; future mean predictions and a widening uncertainty band are displayed over time in periods. Original explanatory schematic, not measured data.</desc>
