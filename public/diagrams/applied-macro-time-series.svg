ht="700" text-anchor="start">Forecast origin</text><polyline points="528,99 571,100 614,100 657,99 657,141 614,136 571,130 528,123" fill="#dce9f7" stroke="#dce2e7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><polyline points="528,111 571,115 614,118 657,120" fill="none" stroke="#e66d59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="528" cy="111" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="571" cy="115" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="614" cy="118" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="657" cy="120" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><text x="621" y="80" fill="#e66d59" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Forecast interval</text><text x="390" y="250" fill="#6c8fca" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Observed history</text><text x="615" y="250" fill="#e66d59" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Forecast mean + widening uncertainty band</text>
