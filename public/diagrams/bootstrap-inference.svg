<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
<title id="title">Bootstrap resampling, replicate trace and distribution</title><desc id="desc">An original four-step schematic shows the observed sample standing in for the population, repeated samples of size n drawn with replacement, and recomputed statistics. A replicate trace supports Monte Carlo stability checks; a histogram shows distribution shape and approximate interval limits. Design-aware resampling is needed for dependent observations. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="280" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">From an observed sample to an estimated sampling distribution</text><rect x="28" y="76" width="130" height="88" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="93" y="103" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 · Observed</text><text x="93" y="124" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">sample of n</text><text x="93" y="144" fill="#6c8fca" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">compute T</text><line x1="158" y1="120" x2="177" y2="120" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="184" y="76" width="140" height="88" rx="13" fill="#fff7e6" stroke="#d8a847" stroke-width="1.5"/><text x="254" y="103" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2 · Empirical</text><text x="254" y="122" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">distribution</text><text x="254" y="144" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">sample stands in</text><line x1="324" y1="120" x2="340" y2="120" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="347" y="76" width="158" height="88" rx="13" fill="#eef7f2" stroke="#4b9279" stroke-width="1.5"/><text x="426" y="101" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3 · Resample</text><text x="426" y="122" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">n with replacement</text><text x="426" y="143" fill="#4b9279" font-family="Arial, sans-serif" font-size="8" font-weight="600" text-anchor="middle">recompute T* · repeat B</text><line x1="505" y1="120" x2="521" y2="120" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="528" y="59" width="200" height="145" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="628" y="78" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">4 · Inspect replicates</text><text x="628" y="98" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">T* by resample number</text><polyline points="542,107 561,113 580,110 599,118 618,109 637,114 656,112 675,106 694,116 713,113" fill="none" stroke="#6c8fca" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="140" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Histogram of T*</text><rect x="548" y="175" width="11" height="9" rx="2" fill="#6c8fca" opacity=".9"/><rect x="566" y="168" width="11" height="16" rx="2" fill="#6c8fca" opacity=".9"/><rect x="584" y="161" width="11" height="23" rx="2" fill="#4b9279" opacity=".9"/><rect x="602" y="153" width="11" height="31" rx="2" fill="#e66d59" opacity=".9"/><rect x="620" y="148" width="11" height="36" rx="2" fill="#e66d59" opacity=".9"/><rect x="638" y="153" width="11" height="31" rx="2" fill="#e66d59" opacity=".9"/><rect x="656" y="160" width="11" height="24" rx="2" fill="#4b9279" opacity=".9"/><rect x="674" y="167" width="11" height="17" rx="2" fill="#6c8fca" opacity=".9"/><rect x="692" y="174" width="11" height="10" rx="2" fill="#6c8fca" opacity=".9"/><line x1="598" y1="146" x2="598" y2="186" stroke="#d8a847" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="680" y1="146" x2="680" y2="186" stroke="#d8a847" stroke-width="1.5" stroke-dasharray="4 3"/><text x="30" y="230" fill="#172239" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Trace: replicate stability  ·  Histogram: shape and tails  ·  resample clusters or time blocks when required</text><text x="30" y="253" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="start">These are simulated reuses of observed data, not new population observations.</text>
<text x="738" y="265" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
