<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
<title id="title">Treatment, mediator, outcome and a hidden common cause</title><desc id="desc">A proposed T-to-M-to-Y pathway, a direct T-to-Y path, and a possible unmeasured cause U of both mediator and outcome. Dashed arrows identify an assumption the analysis must address.</desc>
