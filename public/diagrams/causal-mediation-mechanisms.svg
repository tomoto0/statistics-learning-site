<text x="38" y="48" text-anchor="start" fill="#f8fbff" font-size="19" font-weight="700">Treatment, mediator, outcome and a hidden common cause</text><path d="M205,150 L332,150" fill="none" stroke="#8fb5ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M421,150 L545,150" fill="none" stroke="#61d6b3" stroke-width="3" marker-end="url(#arrow)"/><path d="M205,138 C290,70 465,70 548,138" fill="none" stroke="#ff8a76" stroke-width="3" marker-end="url(#arrow)"/><path d="M270,265 L344,177" fill="none" stroke="#f0c46d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M397,265 L571,177" fill="none" stroke="#f0c46d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><circle cx="166" cy="150" r="31" fill="#8fb5ff" stroke="#17263d" stroke-width="3"/><text x="166" y="156" text-anchor="middle" fill="#101a2b" font-size="20" font-weight="700">T</text><circle cx="376" cy="150" r="31" fill="#ff8a76" stroke="#17263d" stroke-width="3"/><text x="376" y="156" text-anchor="middle" fill="#101a2b" font-size="20" font-weight="700">M</text><circle cx="590" cy="150" r="31" fill="#61d6b3" stroke="#17263d" stroke-width="3"/><text x="590" y="156" text-anchor="middle" fill="#101a2b" font-size="20" font-weight="700">Y</text><circle cx="250" cy="282" r="25" fill="#f0c46d" stroke="#17263d" stroke-width="3"/><text x="250" y="288" text-anchor="middle" fill="#101a2b" font-size="20" font-weight="700">U</text><text x="260" y="137" text-anchor="middle" fill="#8fb5ff" font-size="12" font-weight="700">a</text><text x="480" y="137" text-anchor="middle" fill="#61d6b3" font-size="12" font-weight="700">b</text><text x="374" y="81" text-anchor="middle" fill="#ff8a76" font-size="11" font-weight="700">direct path c′</text><text x="429" y="265" text-anchor="middle" fill="#f0c46d" font-size="10" font-weight="700">possible mediator–outcome confounding</text><text x="166" y="211" text-anchor="middle" fill="#dce7f3" font-size="10" font-weight="500">Treatment</text><text x="376" y="211" text-anchor="middle" fill="#dce7f3" font-size="10" font-weight="500">Mediator</text><text x="590" y="211" text-anchor="middle" fill="#dce7f3" font-size="10" font-weight="500">Outcome</text><text x="250" y="323" text-anchor="middle" fill="#f0c46d" font-size="10" font-weight="500">U is unobserved in this sensitivity scenario</text><text x="380" y="350" text-anchor="middle" fill="#9aabc0" font-size="10" font-weight="500">Arrows are a causal hypothesis; the dashed paths are not ruled out by randomizing T alone.</text>
