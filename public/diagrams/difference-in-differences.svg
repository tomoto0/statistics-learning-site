<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" role="img" aria-labelledby="title desc">
<title id="title">Difference-in-differences: two groups and two periods</title><desc id="desc">Illustrative outcome means aligned to the lesson example: treated 50→56, comparison 48→51. The open dashed endpoint is the treated group&#x27;s unobserved post-period outcome without treatment (53); the observed treated–counterfactual gap is 3 units and equals the difference in group changes only under parallel trends. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="326" rx="18" fill="#f4f6f7"/>
<text x="26" y="29" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Two groups, two periods: compare changes</text><line x1="31" y1="52" x2="53" y2="52" stroke="#e66d59" stroke-width="3"/><text x="59" y="56" fill="#e66d59" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Treated · observed</text><line x1="214" y1="52" x2="236" y2="52" stroke="#6c8fca" stroke-width="3"/><text x="242" y="56" fill="#6c8fca" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Comparison · observed</text><line x1="427" y1="52" x2="449" y2="52" stroke="#e66d59" stroke-width="2.5" stroke-dasharray="7 5"/><text x="455" y="56" fill="#e66d59" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Treated · untreated counterfactual</text><line x1="93" y1="219" x2="628" y2="219" stroke="#657286" stroke-width="1.5"/><line x1="93" y1="219" x2="93" y2="87" stroke="#657286" stroke-width="1.5"/><text x="32" y="153" transform="rotate(-90 32 153)" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Mean outcome (illustrative units)</text><line x1="93" y1="207" x2="628" y2="207" stroke="#dce2e7" stroke-width="1"/><text x="85" y="210" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">40</text><line x1="93" y1="177" x2="628" y2="177" stroke="#dce2e7" stroke-width="1"/><text x="85" y="180" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">45</text><line x1="93" y1="147" x2="628" y2="147" stroke="#dce2e7" stroke-width="1"/><text x="85" y="150" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">50</text><line x1="93" y1="117" x2="628" y2="117" stroke="#dce2e7" stroke-width="1"/><text x="85" y="120" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">55</text><line x1="93" y1="87" x2="628" y2="87" stroke="#dce2e7" stroke-width="1"/><text x="85" y="90" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">60</text><line x1="205" y1="219" x2="205" y2="224" stroke="#657286" stroke-width="1"/><text x="205" y="238" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pre</text><line x1="490" y1="219" x2="490" y2="224" stroke="#657286" stroke-width="1"/><text x="490" y="238" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Post</text><text x="358" y="257" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Period</text><line x1="350" y1="88" x2="350" y2="219" stroke="#d8a847" stroke-width="1.8" stroke-dasharray="6 5"/><text x="350" y="83" fill="#d8a847" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Treatment begins</text><polyline points="205,159 490,141" fill="none" stroke="#6c8fca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="205,147 490,111" fill="none" stroke="#e66d59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="205,147 490,129" fill="none" stroke="#e66d59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><circle cx="205" cy="159" r="4.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="490" cy="141" r="4.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="205" cy="147" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="490" cy="111" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="490" cy="129" r="5" fill="#ffffff" stroke="#e66d59" stroke-width="2"/><text x="194" y="140" fill="#e66d59" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="end">50</text><text x="194" y="171" fill="#6c8fca" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="end">48</text><text x="499" y="106" fill="#e66d59" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="start">56</text><text x="499" y="125" fill="#e66d59" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="start">53 · unobserved</text><text x="499" y="153" fill="#6c8fca" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="start">51</text><line x1="620" y1="111" x2="620" y2="129" stroke="#4b9279" stroke-width="2"/><line x1="615" y1="111" x2="625" y2="111" stroke="#4b9279" stroke-width="2"/><line x1="615" y1="129" x2="625" y2="129" stroke="#4b9279" stroke-width="2"/><text x="628" y="141" fill="#4b9279" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="start">DiD = 3 units</text><text x="33" y="282" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start">(56 − 50) − (51 − 48) = 3 · causal meaning requires parallel trends</text>
<text x="738" y="311" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
