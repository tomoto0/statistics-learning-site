<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244" role="img" aria-labelledby="title desc">
<title id="title">Randomized policy trial</title><desc id="desc">Eligible units are randomly assigned to an offer or comparison group; compare outcomes by assignment. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="244" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Random assignment makes offer and comparison groups comparable</text><rect x="30" y="82" width="160" height="76" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="110" y="112" fill="#172239" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Eligible units</text><text x="110" y="134" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">define the study sample</text><line x1="190" y1="120" x2="260" y2="120" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="266" y="91" width="124" height="58" rx="13" fill="#ffffff" stroke="#657286" stroke-width="1.5"/><text x="328" y="116" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Random</text><text x="328" y="134" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">assignment</text><line x1="390" y1="105" x2="460" y2="79" stroke="#e66d59" stroke-width="2" marker-end="url(#arrow)"/><line x1="390" y1="136" x2="460" y2="163" stroke="#6c8fca" stroke-width="2" marker-end="url(#arrow)"/><rect x="466" y="50" width="248" height="58" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="590" y="75" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Offer group</text><text x="590" y="94" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">estimate intention-to-treat</text><rect x="466" y="133" width="248" height="58" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="590" y="158" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Comparison group</text><text x="590" y="177" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">same assignment lottery</text><text x="590" y="215" fill="#4b9279" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Compare outcomes by original assignment</text>
<text x="738" y="229" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
