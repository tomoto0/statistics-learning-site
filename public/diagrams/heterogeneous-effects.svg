<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" role="img" aria-labelledby="title desc">
<title id="title">Heterogeneous effects forest plot</title><desc id="desc">Illustrative subgroup effect estimates and intervals are plotted in outcome units around a labeled zero-effect reference. Group differences require a direct contrast, not separate significance or interval overlap. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="294" rx="18" fill="#f4f6f7"/>
<text x="26" y="28" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Average effects can differ across pre-specified groups</text><line x1="500" y1="66" x2="500" y2="196" stroke="#657286" stroke-width="1.5" stroke-dasharray="5 5"/><text x="500" y="60" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Zero effect</text><text x="32" y="99" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start">Group A</text><line x1="385" y1="95" x2="500" y2="95" stroke="#6c8fca" stroke-width="3"/><line x1="385" y1="90" x2="385" y2="100" stroke="#6c8fca" stroke-width="1.5"/><line x1="500" y1="90" x2="500" y2="100" stroke="#6c8fca" stroke-width="1.5"/><circle cx="445" cy="95" r="6" fill="#6c8fca" stroke="#ffffff" stroke-width="2"/><text x="32" y="141" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start">Group B</text><line x1="420" y1="137" x2="590" y2="137" stroke="#4b9279" stroke-width="3"/><line x1="420" y1="132" x2="420" y2="142" stroke="#4b9279" stroke-width="1.5"/><line x1="590" y1="132" x2="590" y2="142" stroke="#4b9279" stroke-width="1.5"/><circle cx="510" cy="137" r="6" fill="#4b9279" stroke="#ffffff" stroke-width="2"/><text x="32" y="183" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start">Group C</text><line x1="515" y1="179" x2="685" y2="179" stroke="#e66d59" stroke-width="3"/><line x1="515" y1="174" x2="515" y2="184" stroke="#e66d59" stroke-width="1.5"/><line x1="685" y1="174" x2="685" y2="184" stroke="#e66d59" stroke-width="1.5"/><circle cx="602" cy="179" r="6" fill="#e66d59" stroke="#ffffff" stroke-width="2"/><line x1="300" y1="207" x2="300" y2="212" stroke="#657286" stroke-width="1"/><text x="300" y="222" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">-3</text><line x1="400" y1="207" x2="400" y2="212" stroke="#657286" stroke-width="1"/><text x="400" y="222" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">-1.5</text><line x1="500" y1="207" x2="500" y2="212" stroke="#657286" stroke-width="1"/><text x="500" y="222" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">0</text><line x1="600" y1="207" x2="600" y2="212" stroke="#657286" stroke-width="1"/><text x="600" y="222" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">1.5</text><line x1="700" y1="207" x2="700" y2="212" stroke="#657286" stroke-width="1"/><text x="700" y="222" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">3</text><line x1="300" y1="207" x2="700" y2="207" stroke="#dce2e7" stroke-width="1"/><text x="500" y="240" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Effect estimate (illustrative outcome units)</text><text x="380" y="264" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Point = estimate · bar = interval · subgroup contrast needs a direct test</text>
<text x="738" y="279" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
