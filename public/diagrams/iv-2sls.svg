<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" viewBox="0 0 760 272" role="img" aria-labelledby="title desc">
<title id="title">Instrumental variables causal graph</title><desc id="desc">Z affects D and D affects Y; U confounds D and Y. Instrument relevance, independence from unobserved outcome causes, and exclusion are identifying assumptions, not facts proven by the graph. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="272" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Instrument-driven variation isolates a treatment contrast only under assumptions</text><line x1="205" y1="116" x2="317" y2="89" stroke="#4b9279" stroke-width="3" marker-end="url(#arrow)"/><line x1="438" y1="90" x2="561" y2="114" stroke="#4b9279" stroke-width="3" marker-end="url(#arrow)"/><line x1="416" y1="164" x2="416" y2="111" stroke="#d8a847" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="437" y1="176" x2="566" y2="135" stroke="#d8a847" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="71" y="93" width="150" height="54" rx="13" fill="#edf7f2" stroke="#4b9279" stroke-width="1.5"/><text x="146" y="117" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Z · instrument</text><text x="146" y="135" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">external variation</text><rect x="303" y="59" width="150" height="54" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="378" y="83" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">D · treatment</text><text x="378" y="101" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">endogenous choice</text><rect x="545" y="93" width="150" height="54" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="620" y="117" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Y · outcome</text><text x="620" y="135" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">policy result</text><rect x="303" y="157" width="150" height="54" rx="13" fill="#fff7e6" stroke="#d8a847" stroke-width="1.5"/><text x="378" y="181" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">U · common causes</text><text x="378" y="199" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">unobserved factors</text><text x="146" y="207" fill="#4b9279" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">No direct Z → Y path (exclusion)</text><text x="380" y="237" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Relevance, independence, and exclusion are assumptions</text>
<text x="738" y="257" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
