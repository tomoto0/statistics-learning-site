<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" viewBox="0 0 760 272" role="img" aria-labelledby="title desc">
<title id="title">Binary and count outcomes</title><desc id="desc">An illustrative logistic probability curve shows probabilities between zero and one against a predictor index with labeled ticks; a separate schematic frequency distribution shows discrete count outcomes 0 through 6. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="272" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Match the model to the outcome’s possible values</text><rect x="42" y="68" width="315" height="133" rx="14" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/><rect x="403" y="68" width="315" height="133" rx="14" fill="#ffffff" stroke="#dce2e7" stroke-width="1"/><text x="60" y="91" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">Binary outcome Y ∈ {0,1}</text><text x="420" y="91" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start">Count outcome</text><line x1="66" y1="176" x2="334" y2="176" stroke="#657286" stroke-width="1"/><line x1="66" y1="176" x2="66" y2="107" stroke="#657286" stroke-width="1"/><text x="48" y="142" transform="rotate(-90 48 142)" fill="#657286" font-family="Arial, sans-serif" font-size="8" text-anchor="middle">Predicted probability</text><line x1="62" y1="176" x2="66" y2="176" stroke="#657286" stroke-width="1"/><text x="59" y="179" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="end">0</text><line x1="62" y1="143" x2="66" y2="143" stroke="#657286" stroke-width="1"/><text x="59" y="146" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="end">0.5</text><line x1="62" y1="110" x2="66" y2="110" stroke="#657286" stroke-width="1"/><text x="59" y="113" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="end">1</text><line x1="70" y1="176" x2="70" y2="181" stroke="#657286" stroke-width="1"/><text x="70" y="193" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">-4</text><line x1="196" y1="176" x2="196" y2="181" stroke="#657286" stroke-width="1"/><text x="196" y="193" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">0</text><line x1="322" y1="176" x2="322" y2="181" stroke="#657286" stroke-width="1"/><text x="322" y="193" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">4</text><text x="196" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Predictor index (illustrative units)</text><polyline points="70,169 77,169 84,169 91,168 98,168 105,167 112,167 119,166 126,165 133,164 140,163 147,161 154,159 161,157 168,155 175,152 182,149 189,145 196,142 203,139 210,135 217,132 224,129 231,127 238,125 245,123 252,121 259,120 266,119 273,118 280,117 287,117 294,116 301,116 308,115 315,115 322,115" fill="none" stroke="#e66d59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="235" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Logit probability stays in [0, 1]</text><line x1="425" y1="176" x2="695" y2="176" stroke="#657286" stroke-width="1"/><text x="560" y="105" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Illustrative frequency</text><rect x="444" y="154" width="22" height="22" rx="3" fill="#6c8fca" opacity=".86"/><rect x="478" y="137" width="22" height="39" rx="3" fill="#6c8fca" opacity=".86"/><rect x="512" y="114" width="22" height="62" rx="3" fill="#6c8fca" opacity=".86"/><rect x="546" y="125" width="22" height="51" rx="3" fill="#6c8fca" opacity=".86"/><rect x="580" y="145" width="22" height="31" rx="3" fill="#6c8fca" opacity=".86"/><rect x="614" y="158" width="22" height="18" rx="3" fill="#6c8fca" opacity=".86"/><rect x="648" y="167" width="22" height="9" rx="3" fill="#6c8fca" opacity=".86"/><text x="455" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">0</text><text x="489" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">1</text><text x="523" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">2</text><text x="557" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">3</text><text x="591" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">4</text><text x="625" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">5</text><text x="659" y="190" fill="#657286" font-family="Arial, sans-serif" font-size="7" font-weight="500" text-anchor="middle">6</text><text x="560" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Count outcome value</text><text x="560" y="235" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Illustrative count frequencies</text>
<text x="738" y="257" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
