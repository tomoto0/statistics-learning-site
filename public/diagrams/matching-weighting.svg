<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" role="img" aria-labelledby="title desc">
<title id="title">Covariate balance before and after matching</title><desc id="desc">Schematic signed standardized mean differences show measured covariates closer to zero after matching or weighting; the horizontal axis is in standard-deviation units. Unmeasured confounding can remain. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="294" rx="18" fill="#f4f6f7"/>
