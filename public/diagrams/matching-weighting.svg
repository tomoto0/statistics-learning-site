" font-weight="500" text-anchor="start">Prior income</text><line x1="271" y1="88" x2="368" y2="88" stroke="#dce2e7" stroke-width="1"/><circle cx="271" cy="88" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="368" cy="88" r="4.5" fill="#4b9279" stroke="none" stroke-width="1"/><text x="34" y="119" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Age</text><line x1="417" y1="115" x2="488" y2="115" stroke="#dce2e7" stroke-width="1"/><circle cx="488" cy="115" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="417" cy="115" r="4.5" fill="#4b9279" stroke="none" stroke-width="1"/><text x="34" y="146" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Education</text><line x1="318" y1="142" x2="379" y2="142" stroke="#dce2e7" stroke-width="1"/><circle cx="318" cy="142" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="379" cy="142" r="4.5" fill="#4b9279" stroke="none" stroke-width="1"/><text x="34" y="173" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Baseline health</text><line x1="429" y1="169" x2="538" y2="169" stroke="#dce2e7" stroke-width="1"/><circle cx="538" cy="169" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="429" cy="169" r="4.5" fill="#4b9279" stroke="none" stroke-width="1"/><text x="34" y="200" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="start">Region</text><line x1="351" y1="196" x2="384" y2="196" stroke="#dce2e7" stroke-width="1"/><circle cx="351" cy="196" r="4.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="384" cy="196" r="4.5" fill="#4b9279" stroke="none" stroke-width="1"/><circle cx="430" cy="239" r="4" fill="#e66d59" stroke="none" stroke-width="1"/><text x="440" y="243" fill="#e66d59" font-family="Arial, sans-serif" font-size="8" font-weight="600" text-anchor="start">Befor