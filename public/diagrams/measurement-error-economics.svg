<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Measurement error in an economic predictor</title><desc id="desc">The observed predictor equals the latent quantity plus measurement error. Side-by-side schematic relationships contrast a less steep observed association under a classical additive predictor-error model; attenuation is conditional on assumptions and is not universal. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="300" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Separate the economic concept from its recorded proxy</text><rect x="37" y="76" width="176" height="65" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="125" y="103" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Latent quantity X</text><text x="125" y="123" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">true but not fully observed</text><rect x="292" y="76" width="176" height="65" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="380" y="103" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Recorded X*</text><text x="380" y="123" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">X* = X + measurement error u</text><line x1="213" y1="108" x2="292" y2="108" stroke="#d8a847" stroke-width="2" marker-end="url(#arrow)"/><text x="252" y="91" fill="#d8a847" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">add u</text><rect x="547" y="76" width="176" height="65" rx="13" fill="#eef7f2" stroke="#4b9279" stroke-width="1.5"/><text x="635" y="103" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Outcome Y</text><text x="635" y="123" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">economic outcome</text><line x1="468" y1="108" x2="547" y2="108" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="171" width="318" height="96" rx="13" fill="#ffffff" stroke="#dce2e7" stroke-width="1.5"/><rect x="394" y="171" width="318" height="96" rx="13" fill="#ffffff" stroke="#dce2e7" stroke-width="1.5"/><text x="207" y="190" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">True X vs Y</text><text x="553" y="190" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Noisy X* vs Y</text><circle cx="92" cy="246" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="130" cy="235" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="168" cy="224" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="206" cy="211" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="244" cy="196" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="282" cy="184" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><line x1="88" y1="250" x2="291" y2="177" stroke="#6c8fca" stroke-width="2.5"/><circle cx="428" cy="243" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="462" cy="249" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="490" cy="222" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="520" cy="231" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="548" cy="203" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="580" cy="215" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="612" cy="181" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="654" cy="194" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><line x1="423" y1="246" x2="659" y2="195" stroke="#e66d59" stroke-width="2.5"/><line x1="423" y1="255" x2="659" y2="173" stroke="#4b9279" stroke-width="2" stroke-dasharray="5 4"/><text x="553" y="280" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Slope may flatten only under classical-error assumptions</text>
<text x="738" y="285" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
