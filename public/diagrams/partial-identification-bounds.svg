<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">Missing binary outcomes imply treatment-effect bounds</title><desc id="desc">Synthetic response and pass rates for treatment and control groups imply an effect range from about minus 0.029 to plus 0.311, crossing zero. Gold segments indicate outcomes not observed.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill="#9aabc0"/></marker></defs>
<rect width="760" height="340" rx="24" fill="#101a2b"/><rect x="16" y="16" width="728" height="308" rx="20" fill="#17263d" stroke="#31415a" stroke-width="2"/>
<text x="38" y="48" text-anchor="start" fill="#f8fbff" font-size="19" font-weight="700">Missing binary outcomes imply treatment-effect bounds</text><text x="40" y="79" text-anchor="start" fill="#dce7f3" font-size="12" font-weight="700">Observed sample</text><text x="40" y="112" text-anchor="start" fill="#9aabc0" font-size="10" font-weight="500">Training offer</text><text x="40" y="159" text-anchor="start" fill="#9aabc0" font-size="10" font-weight="500">Control</text><rect x="128" y="94" width="210" height="24" rx="5" fill="#8fb5ff" stroke="none" stroke-width="0"/><rect x="312.8" y="94" width="25.2" height="24" rx="5" fill="#f0c46d" stroke="none" stroke-width="0"/><rect x="128" y="141" width="163.8" height="24" rx="5" fill="#61d6b3" stroke="none" stroke-width="0"/><rect x="291.8" y="141" width="46.2" height="24" rx="5" fill="#f0c46d" stroke="none" stroke-width="0"/><text x="128" y="135" text-anchor="start" fill="#dce7f3" font-size="9" font-weight="500">88% observed · 74% pass</text><text x="128" y="182" text-anchor="start" fill="#dce7f3" font-size="9" font-weight="500">78% observed · 59% pass</text><text x="130" y="205" text-anchor="start" fill="#f0c46d" font-size="9" font-weight="500">Gold = outcomes not observed; they may be 0 or 1</text><text x="406" y="79" text-anchor="start" fill="#dce7f3" font-size="12" font-weight="700">Compatible treatment-effect set</text><line x1="524.6666666666666" y1="103" x2="524.6666666666666" y2="194" stroke="#f0c46d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="527.6666666666666" y="101" text-anchor="start" fill="#f0c46d" font-size="9" font-weight="500">0</text><line x1="511.23" y1="144" x2="668.7633333333333" y2="144" stroke="#ff8a76" stroke-width="8"/><line x1="511.23" y1="134" x2="511.23" y2="154" stroke="#ff8a76" stroke-width="2"/><line x1="668.7633333333333" y1="134" x2="668.7633333333333" y2="154" stroke="#ff8a76" stroke-width="2"/><circle cx="511.23" cy="144" r="5" fill="#ff8a76" stroke="#17263d" stroke-width="1"/><circle cx="668.7633333333333" cy="144" r="5" fill="#ff8a76" stroke="#17263d" stroke-width="1"/><line x1="432" y1="195" x2="710" y2="195" stroke="#9aabc0" stroke-width="1"/><line x1="432.0" y1="192" x2="432.0" y2="198" stroke="#9aabc0" stroke-width="1"/><text x="432.0" y="212" text-anchor="middle" fill="#9aabc0" font-size="9" font-weight="500">-0.2</text><line x1="524.7" y1="192" x2="524.7" y2="198" stroke="#9aabc0" stroke-width="1"/><text x="524.7" y="212" text-anchor="middle" fill="#9aabc0" font-size="9" font-weight="500">0.0</text><line x1="617.3" y1="192" x2="617.3" y2="198" stroke="#9aabc0" stroke-width="1"/><text x="617.3" y="212" text-anchor="middle" fill="#9aabc0" font-size="9" font-weight="500">0.2</text><line x1="710.0" y1="192" x2="710.0" y2="198" stroke="#9aabc0" stroke-width="1"/><text x="710.0" y="212" text-anchor="middle" fill="#9aabc0" font-size="9" font-weight="500">0.4</text><text x="571.0" y="238" text-anchor="middle" fill="#dce7f3" font-size="10" font-weight="500">Effect on pass rate</text><text x="589.9966666666667" y="171" text-anchor="middle" fill="#ff8a76" font-size="11" font-weight="700">−0.029 to +0.311</text><text x="380" y="273" text-anchor="middle" fill="#9aabc0" font-size="10" font-weight="500">Binary outcome: unknown cases widen each group&#x27;s mean range.</text><text x="380" y="293" text-anchor="middle" fill="#f0c46d" font-size="10" font-weight="500">The interval crossing zero means the sign is not identified without more assumptions.</text>
<text x="722" y="312" text-anchor="end" fill="#9aabc0" font-size="10" font-weight="700" letter-spacing="1">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
