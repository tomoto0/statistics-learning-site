<svg xmlns="http://www.w3.org/2000/svg" width="760" height="286" viewBox="0 0 760 286" role="img" aria-labelledby="title desc">
<title id="title">Price index and real-value conversion</title><desc id="desc">Illustrative category weights combine item price relatives into an index normalized to 100 in a base period. A compatible index can deflate a nominal amount. The schematic weights and relatives are examples, not official CPI data. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="286" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">A weighted basket turns item price relatives into an index</text><rect x="38" y="76" width="190" height="37" rx="8" fill="#ffffff" stroke="#dce2e7" stroke-width="1.5"/><text x="52" y="99" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start">Food</text><text x="207" y="99" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">weight 35%</text><line x1="244" y1="94" x2="340" y2="94" stroke="#6c8fca" stroke-width="5"/><circle cx="361.6" cy="94" r="5" fill="#6c8fca" stroke="none" stroke-width="1"/><text x="350" y="98" fill="#6c8fca" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">price relative 1.08</text><rect x="38" y="125" width="190" height="37" rx="8" fill="#ffffff" stroke="#dce2e7" stroke-width="1.5"/><text x="52" y="148" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start">Housing</text><text x="207" y="148" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">weight 45%</text><line x1="244" y1="143" x2="340" y2="143" stroke="#e66d59" stroke-width="5"/><circle cx="356.2" cy="143" r="5" fill="#e66d59" stroke="none" stroke-width="1"/><text x="350" y="147" fill="#e66d59" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">price relative 1.06</text><rect x="38" y="174" width="190" height="37" rx="8" fill="#ffffff" stroke="#dce2e7" stroke-width="1.5"/><text x="52" y="197" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start">Transport</text><text x="207" y="197" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">weight 20%</text><line x1="244" y1="192" x2="340" y2="192" stroke="#4b9279" stroke-width="5"/><circle cx="334.6" cy="192" r="5" fill="#4b9279" stroke="none" stroke-width="1"/><text x="350" y="196" fill="#4b9279" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">price relative 0.98</text><line x1="505" y1="83" x2="505" y2="213" stroke="#d8a847" stroke-width="2"/><text x="505" y="72" fill="#d8a847" font-family="Arial, sans-serif" font-size="8" font-weight="600" text-anchor="middle">weighted basket</text><rect x="545" y="94" width="180" height="66" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="635" y="120" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Price indexₜ</text><text x="635" y="143" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">base period = 100</text><line x1="635" y1="160" x2="635" y2="190" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><rect x="545" y="195" width="180" height="58" rx="13" fill="#eef7f2" stroke="#4b9279" stroke-width="1.5"/><text x="635" y="218" fill="#172239" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Real value = nominal</text><text x="635" y="237" fill="#4b9279" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">÷ (index / 100)</text><text x="38" y="263" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="start">Index changes describe the stated basket; household experience and official methods may differ.</text>
<text x="738" y="271" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
