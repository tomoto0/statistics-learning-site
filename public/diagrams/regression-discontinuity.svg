<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Regression discontinuity at a policy threshold</title><desc id="desc">Illustrative observations and local fitted trends show outcomes just below and above a cutoff. The jump is a local contrast; causal interpretation requires continuity and no precise manipulation. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
