ke="#657286" stroke-width="1"/><text x="400" y="213" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">0</text><line x1="540" y1="196" x2="540" y2="201" stroke="#657286" stroke-width="1"/><text x="540" y="213" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">4</text><line x1="680" y1="196" x2="680" y2="201" stroke="#657286" stroke-width="1"/><text x="680" y="213" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">8</text><text x="400" y="239" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Mint outline = local fitting window · observations are simulated</text><line x1="400" y1="62" x2="400" y2="196" stroke="#d8a847" stroke-width="2" stroke-dasharray="6 5"/><text x="407" y="72" fill="#d8a847" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Cutoff</text><circle cx="112" cy="156" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="135" cy="158" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="158" cy="146" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="181" cy="150" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="204" cy="142" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="227" cy="147" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="250" cy="137" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="273" cy="137" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="296" cy="127" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="319" cy="133" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="342" cy="124" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="365" cy="124" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="424" cy="126.0" 