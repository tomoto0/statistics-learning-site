<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244" role="img" aria-labelledby="title desc">
<title id="title">From question to credible estimate</title><desc id="desc">Question, population, treatment, comparison design and estimand flow. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="244" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">A defensible analysis starts with the question</text><rect x="28" y="86" width="144" height="74" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="100" y="115" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Population</text><text x="100" y="137" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Who is the claim about?</text><rect x="210" y="86" width="144" height="74" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="282" y="115" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Treatment &amp; outcome</text><text x="282" y="137" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Assigned, measured, and when?</text><rect x="392" y="86" width="144" height="74" rx="13" fill="#eef7f2" stroke="#4b9279" stroke-width="1.5"/><text x="464" y="115" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Comparison design</text><text x="464" y="137" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">What is the counterfactual?</text><rect x="574" y="86" width="144" height="74" rx="13" fill="#fbf4e3" stroke="#d8a847" stroke-width="1.5"/><text x="646" y="115" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Estimand &amp; checks</text><text x="646" y="137" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Effect, for whom, assumptions?</text><line x1="174" y1="123" x2="204" y2="123" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><line x1="356" y1="123" x2="386" y2="123" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/><line x1="538" y1="123" x2="568" y2="123" stroke="#657286" stroke-width="2" marker-end="url(#arrow)"/>
<text x="738" y="229" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
