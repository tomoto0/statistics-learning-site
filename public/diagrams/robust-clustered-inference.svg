<svg xmlns="http://www.w3.org/2000/svg" width="760" height="272" viewBox="0 0 760 272" role="img" aria-labelledby="title desc">
<title id="title">Clustered outcomes and policy assignment</title><desc id="desc">Illustrative individual observations grouped within districts. Assignment and shared dependence can operate at cluster level; the number of clusters matters for uncertainty. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
