"10" font-weight="700" text-anchor="middle">District 3</text><circle cx="410" cy="112" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><circle cx="440" cy="112" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><circle cx="470" cy="112" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><circle cx="410" cy="147" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><circle cx="440" cy="147" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><circle cx="470" cy="147" r="8" fill="#4b9279" stroke="#ffffff" stroke-width="1.5"/><rect x="545" y="82" width="110" height="110" rx="14" fill="#ffffff" stroke="#d8a847" stroke-width="2"/><text x="600" y="75" fill="#d8a847" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">District 4</text><circle cx="570" cy="112" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><circle cx="600" cy="112" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><circle cx="630" cy="112" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><circle cx="570" cy="147" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><circle cx="600" cy="147" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><circle cx="630" cy="147" r="8" fill="#d8a847" stroke="#ffffff" stroke-width="1.5"/><line x1="60" y1="210" x2="700" y2="210" stroke="#172239" stroke-width="2"/><text x="380" y="224" fill="#172239" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Assignment and shared dependence may be clustered—not each row</text><text x="380" y="246" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Few clusters need appropriate small-sample or design-based inference</text>
