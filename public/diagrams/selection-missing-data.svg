<svg xmlns="http://www.w3.org/2000/svg" width="760" height="244" viewBox="0 0 760 244" role="img" aria-labelledby="title desc">
<title id="title">Selection and missing outcomes flow</title><desc id="desc">All assigned units branch to observed or missing outcomes. Models, weighting, or imputation require assumptions; sensitivity analysis considers plausible unseen outcomes. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="244" rx="18" fill="#f4f6f7"/>
<text x="26" y="30" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">Follow every assigned unit through outcome measurement</text><rect x="42" y="88" width="150" height="66" rx="13" fill="#edf2fa" stroke="#6c8fca" stroke-width="1.5"/><text x="117" y="116" fill="#172239" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Assigned sample</text><text x="117" y="136" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">keep denominator</text><line x1="192" y1="121" x2="224" y2="121" stroke="#657286" stroke-width="2"/><line x1="224" y1="84" x2="224" y2="167" stroke="#657286" stroke-width="2"/><circle cx="224" cy="121" r="3" fill="#657286" stroke="none" stroke-width="1"/><rect x="258" y="54" width="174" height="60" rx="13" fill="#edf7f2" stroke="#4b9279" stroke-width="1.5"/><text x="345" y="80" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Outcome observed</text><text x="345" y="99" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">include in analysis</text><rect x="258" y="137" width="174" height="60" rx="13" fill="#fff2ed" stroke="#e66d59" stroke-width="1.5"/><text x="345" y="163" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Follow-up missing</text><text x="345" y="182" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">why did loss occur?</text><line x1="224" y1="84" x2="258" y2="84" stroke="#4b9279" stroke-width="2" marker-end="url(#arrow)"/><line x1="224" y1="167" x2="258" y2="167" stroke="#e66d59" stroke-width="2" marker-end="url(#arrow)"/><rect x="506" y="52" width="210" height="64" rx="13" fill="#ffffff" stroke="#6c8fca" stroke-width="1.5"/><text x="611" y="79" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Observed-data model</text><text x="611" y="98" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">MAR / weighting or imputation</text><rect x="506" y="137" width="210" height="64" rx="13" fill="#ffffff" stroke="#d8a847" stroke-width="1.5"/><text x="611" y="164" fill="#172239" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sensitivity analysis</text><text x="611" y="183" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">plausible unseen outcomes</text><text x="380" y="224" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="middle">MAR / MNAR assumptions cannot be verified from observed outcomes alone</text>
<text x="738" y="229" text-anchor="end" fill="#657286" font-family="Arial, sans-serif" font-size="9">ORIGINAL SCHEMATIC · NOT DATA</text>
</svg>
