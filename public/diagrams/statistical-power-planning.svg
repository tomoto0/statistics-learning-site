<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-labelledby="title desc">
<title id="title">Statistical power, overlapping distributions and sample-size planning</title><desc id="desc">An original two-panel illustration contrasts the null and a specified alternative distribution around a rejection cutoff. The shaded right tail under H₁ beyond the cutoff represents power for that specified alternative; power depends on the effect, variability and design. A separate power-versus-independent-sample-size curve is schematic. Precision planning is a distinct target and neither calculation guarantees a result. Original explanatory schematic, not measured data.</desc>
