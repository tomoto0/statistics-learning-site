<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" role="img" aria-labelledby="title desc">
<title id="title">Synthetic control comparison</title><desc id="desc">The observed treated outcome is compared with a weighted synthetic control built from donor units. The horizontal axis is time in periods and the vertical axis is illustrative outcome units; the gap is descriptive, not automatically causal. Original explanatory schematic, not measured data.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#657286"/></marker></defs>
<rect x="0" y="0" width="760" height="294" rx="18" fill="#f4f6f7"/>
<text x="26" y="28" fill="#172239" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start">A weighted donor group can provide a comparison for one treated case</text><line x1="72" y1="194" x2="710" y2="194" stroke="#657286" stroke-width="1.5"/><line x1="72" y1="194" x2="72" y2="61" stroke="#657286" stroke-width="1.5"/><line x1="72" y1="194" x2="710" y2="194" stroke="#dce2e7" stroke-width="1"/><line x1="68" y1="194" x2="72" y2="194" stroke="#657286" stroke-width="1"/><text x="62" y="197" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">0</text><line x1="72" y1="127.5" x2="710" y2="127.5" stroke="#dce2e7" stroke-width="1"/><line x1="68" y1="127.5" x2="72" y2="127.5" stroke="#657286" stroke-width="1"/><text x="62" y="130.5" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">5</text><line x1="72" y1="61" x2="710" y2="61" stroke="#dce2e7" stroke-width="1"/><line x1="68" y1="61" x2="72" y2="61" stroke="#657286" stroke-width="1"/><text x="62" y="64" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="end">10</text><text x="390" y="220" fill="#657286" font-family="Arial, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Time (periods)</text><text x="24" y="127" transform="rotate(-90 24 127)" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Outcome (illustrative units)</text><line x1="92" y1="51" x2="114" y2="51" stroke="#e66d59" stroke-width="3"/><text x="120" y="55" fill="#e66d59" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Treated (observed)</text><line x1="290" y1="51" x2="312" y2="51" stroke="#6c8fca" stroke-width="3"/><text x="318" y="55" fill="#6c8fca" font-family="Arial, sans-serif" font-size="9" font-weight="600" text-anchor="start">Synthetic control (weighted donors)</text><text x="286" y="75" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRE-INTERVENTION</text><text x="593" y="75" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">POST-INTERVENTION</text><line x1="95" y1="194" x2="95" y2="199" stroke="#657286" stroke-width="1"/><text x="95" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">0</text><line x1="245" y1="194" x2="245" y2="199" stroke="#657286" stroke-width="1"/><text x="245" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">2</text><line x1="395" y1="194" x2="395" y2="199" stroke="#657286" stroke-width="1"/><text x="395" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">4</text><line x1="545" y1="194" x2="545" y2="199" stroke="#657286" stroke-width="1"/><text x="545" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">6</text><line x1="695" y1="194" x2="695" y2="199" stroke="#657286" stroke-width="1"/><text x="695" y="211" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">8</text><text x="390" y="239" fill="#657286" font-family="Arial, sans-serif" font-size="8" font-weight="500" text-anchor="middle">Simulated series · post-policy gap is descriptive</text><polyline points="95,154 170,149 245,136 320,132 395,121 470,115 545,106 620,97 695,91" fill="none" stroke="#6c8fca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="95,155 170,144 245,139 320,129 395,123 470,116 545,92 620,73 695,62" fill="none" stroke="#e66d59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95" cy="154" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="170" cy="149" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="245" cy="136" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="320" cy="132" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="395" cy="121" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="470" cy="115" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="545" cy="106" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="620" cy="97" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="695" cy="91" r="3.5" fill="#6c8fca" stroke="none" stroke-width="1"/><circle cx="95" cy="155" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="170" cy="144" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="245" cy="139" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="320" cy="129" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="395" cy="123" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="470" cy="116" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="545" cy="92" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="620" cy="73" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><circle cx="695" cy="62" r="3.5" fill="#e66d59" stroke="none" stroke-width="1"/><line x1="505" y1="62" x2="505" y2="194" stroke="#d8a847" stroke-width="2" stroke-dasharray="6 5"/><text x="510" y="94" fill="#d8a847" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="start">Intervention</text><text x="26" y="263" fill="#657286" font-family="Arial, sans-serif" font-size="9" font-weight="500" text-anchor="start">Post-intervention gap is descriptive; it is not automatically causal.</text>
