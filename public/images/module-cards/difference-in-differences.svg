  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L0,10 L9,5 z" fill="#9aabc0"/></marker>
</defs>
<rect width="600" height="400" rx="28" fill="url(#surface)"/>
