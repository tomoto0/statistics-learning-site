<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Difference-in-Differences &amp; Event Studies — concept illustration</title>
<desc id="desc">Canonical two-group, two-period schematic aligned to the lesson example. Observed means are treated 50→56 and comparison 48→51; the open dashed treated-post value of 53 is the unobserved untreated counterfactual. The difference in changes is 3 illustrative outcome units under parallel trends. Original schematic for learning, not measured data.</desc>
