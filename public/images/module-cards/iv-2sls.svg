<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Instrumental Variables &amp; Two-Stage Least Squares — concept illustration</title>
<desc id="desc">A causal graph shows instrument Z affecting treatment D and outcome Y only through D, while U confounds D and Y. The exclusion restriction is the absence of a direct Z-to-Y arrow; relevance, independence, and exclusion remain assumptions. Original schematic for learning, not measured data.</desc>
<defs>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2b"/><stop offset="1" stop-color="#15243a"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L0,10 L9,5 z" fill="#9aabc0"/></marker>
</defs>
<rect width="600" height="400" rx="28" fill="url(#surface)"/>
<rect x="18" y="18" width="564" height="364" rx="23" fill="#17263d" stroke="#31415a" stroke-width="2"/>
