<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Partial Identification, Bounds &amp; Sensitivity — concept illustration</title><desc id="desc">Observed and missing binary outcomes produce a treatment-effect interval rather than one exact point; zero remains inside this example set. Original schematic, not measured data.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2b"/><stop offset="1" stop-color="#15243a"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L0,10 L9,5 z" fill="#9aabc0"/></marker></defs>
<rect width="600" height="400" rx="28" fill="url(#surface)"/><rect x="18" y="18" width="564" height="364" rx="23" fill="#17263d" stroke="#31415a" stroke-width="2"/>
<rect x="88" y="134" width="190" height="78" rx="10" fill="#203553" stroke="#31415a" stroke-width="1"/><rect x="88" y="226" width="190" height="54" rx="10" fill="#203553" stroke="#31415a" stroke-width="1"/><text x="105" y="158" text-anchor="start" fill="#dce7f3" font-size="10" font-weight="700">Treatment group</text><rect x="105" y="174" width="136" height="13" rx="4" fill="#8fb5ff" stroke="none" stroke-width="0"/><rect x="241" y="174" width="18" height="13" rx="4" fill="#f0c46d" stroke="none" stroke-width="0"/><text x="105" y="248" text-anchor="start" fill="#dce7f3" font-size="10" font-weight="700">Control group</text><rect x="105" y="263" width="119" height="13" rx="4" fill="#61d6b3" stroke="none" stroke-width="0"/><rect x="224" y="263" width="35" height="13" rx="4" fill="#f0c46d" stroke="none" stroke-width="0"/><line x1="337" y1="250" x2="510" y2="250" stroke="#9aabc0" stroke-width="1"/><line x1="414" y1="135" x2="414" y2="252" stroke="#f0c46d" stroke-width="2" stroke-dasharray="6 5"/><line x1="365" y1="198" x2="493" y2="198" stroke="#ff8a76" stroke-width="7"/><circle cx="365" cy="198" r="7" fill="#ff8a76" stroke="#17263d" stroke-width="2"/><circle cx="493" cy="198" r="7" fill="#ff8a76" stroke="#17263d" stroke-width="2"/><text x="414" y="128" text-anchor="middle" fill="#f0c46d" font-size="9" font-weight="500">zero</text><text x="429" y="177" text-anchor="middle" fill="#ff8a76" font-size="9" font-weight="700">compatible effect range</text><text x="300" y="311" text-anchor="middle" fill="#dce7f3" font-size="10" font-weight="500">Stronger assumptions can narrow the set</text><text x="300" y="344" text-anchor="middle" fill="#dce7f3" font-size="11" font-weight="700">Observed data → lower and upper effect bounds</text><text x="548" y="365" text-anchor="end" fill="#9aabc0" font-size="11" font-weight="700" letter-spacing="1.2">CONCEPT · NOT DATA</text>
</svg>
