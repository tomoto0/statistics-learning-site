<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Price Indices &amp; Real Economic Values — concept illustration</title>
<desc id="desc">Weighted item price changes form an index used to deflate a nominal value. Original schematic for learning, not measured data.</desc>
