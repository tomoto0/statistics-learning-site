<title id="title">Statistical Thinking &amp; Descriptive Analytics — concept illustration</title>
<desc id="desc">A schematic histogram shows a low-frequency, isolated right-tail bin; its mean is to the right of its median. Original schematic for learning, not measured data.</desc>
